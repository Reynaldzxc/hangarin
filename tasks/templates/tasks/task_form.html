
{% extends "tasks/base.html" %}

{% block content %}

<h2 class="mb-4">Create Task</h2>

<form method="post">

    {% csrf_token %}

    {{ form.as_p }}

{% if form.errors %}
    <div class="alert alert-danger">
        {{ form.errors }}
    </div>
{% endif %}

    <button type="submit" class="btn btn-primary">
        Save Task
    </button>

    <a href="{% url 'task_list' %}" class="btn btn-secondary">
        Cancel
    </a>

</form>

{% endblock %}
